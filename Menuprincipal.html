<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="livestrap.css">
    <title>MenuPrincipal</title>

</head>
<!--Se establece una barra de navegación que puede llevar a Menú principal, movimientos o cerrar sesión -->
<body class="bg-light" style="padding: 20px;">
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">Alke Wallet</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
                aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse " id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link active" aria-current="page" href="Menuprincipal.html">Menú Principal</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="transactions.html">Movimientos</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="walletejercicio.html">Cerrar sesión</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>
<!--Se utiliza tarjetas con diseño responsivo ( p-3 y p-md-5) para visualizar el saldo disponible-->
    <div class="container mt-5 p-3 p-md-5">
        <h1>Menú Principal</h1>
        <div class="row g-4">
            <div class="col-md-6 col-lg-4">
                <div class="card border-0 shadow-sm h-100">
                    <div class="card-body">
                        <h6 class="card-subtitle mb-2 text-muted">Saldo Disponible</h6>
                        <h3 class="card-title text-success fw-bold" id="currentBalance">$0.00</h3>
                    </div>
                </div>
            </div>

<!-- Se utiliza tarjeta con diseño responsivo a través de grillas col-md-6 y col-lg-8 y de los elementos flex-wrap y gap-3. Esta tarjeta cuenta con dos botones que llevan a la pantalla para depósito y enviar dinero. -->
            <div class="card border-0 shadow-sm col-md-6 col-lg-8">
                <div class="card-body d-flex gap-3 flex-wrap ">
                    <h5 class="card-title">¿Qué quieres hacer en tu cuenta?</h5>
                    <p class="card-text">Selecciona una de las opciones.</p>
                    <a href="sendmoney.html" class="btn btn-outline-primary flex-fill py-3">Enviar dinero</a>
                    <a href="deposit.html" class="btn btn-outline-primary flex-fill py-3">Depositar</a>
                </div>
            </div>



        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="Menuprincipal.js"></script>
</body>

</html>
