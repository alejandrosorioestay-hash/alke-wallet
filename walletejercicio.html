<!DOCTYPE html>
<html lang="en">

<head class="background-color #e3f2fd">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="livestrap.css">
    <title>Billetera Digital</title>

</head>

<body style="padding: 50px; max-width: 600px; margin: 0 auto;">
    <nav class="navbar bg-body-tertiary">
        <div class="container-fluid">
            <span class="navbar-brand mb-0 h1 text-center">Alke Wallet</span>
        </div>
    </nav>
    <!--- Se crea el espacio de inicio de sesión centrado en estilo tarjeta (card)-->
    <div class="card shadow-sm d-flex justify-content-center align-items-center p-5">
        <h2 class="text-center" style="color: cornflowerblue;">Inicio de sesión</h2>
        <p class="text-center text-muted">Ingresa a tu cuenta financiera</p>

        <form id="loginForm" class="mx-auto mt-4" style="width:50%">
            <div class="mb-3">
                <label for="exampleInputEmail1" class="form-label">Email</label>
                <input type="email" class="form-control" id="exampleInputEmail1">
            </div>
            <div class="mb-3">
                <label for="exampleInputPassword1" class="form-label">Contraseña</label>
                <input type="password" class="form-control" id="exampleInputPassword1">
            </div>

            <button type="submit" class="btn btn-primary">Iniciar sesión</button>


        </form>

    </div>


    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="walletquery.js"></script>
</body>

</html>
