<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <title>SendMoney</title>
    <style>
        .selected {
            background-color: #d1e7dd !important;
            border-color: #0f5132 !important;
        }

        .list-group-item {
            cursor: pointer;
        }
    </style>
</head>

<body style="padding: 20px;">
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">Alke Wallet</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
                aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" aria-current="page" href="Menuprincipal.html">Menú Principal</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="transactions.html">Movimientos</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="walletejercicio.html">Cerrar sesión</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>
    <!--Se utiliza tarjeta para crear el espacio de búsqueda y lista de contactos. Para esto último se recurre a lista <ul>;<li> -->
    <div class="card text-center container mt-5 shadow-sm p-5 mx-auto " style="max-width: 400px;">
        <h2 class="text-center">Enviar Dinero</h2>

        <div class="mb-3">
            <label for="searchContact" class="form-label">Buscar en la agenda</label>
            <input type="text" class="form-control" id="searchContact" placeholder="Buscar Contacto">
        </div>

        <div class="text-center">
            <button type="button" class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#modalContacto">
                Agregar nuevo contacto
            </button>
        </div>

        <h3 class="text-center" style="margin-top: 30px;">Selecciona un contacto</h3>
        <ul id="contactList" class="list-group">
            <li class="list-group-item">
                <div class="contact-info">
                    <strong class="contact-name">Alejandro Ruiz</strong><br>
                    <small class="contactDetails">CBU: 123456789, Alias: Alejandro, Banco: ABC Bank</small>
                </div>
            </li>
            <li class="list-group-item">
                <div class="contact-info">
                    <strong class="contact-name">Oscar Monteagudo</strong><br>
                    <small class="contactDetails">CBU: 133476786, Alias: Oscar, Banco: ABC Bank</small>
                </div>
            </li>
        </ul>
        <div class="text-center mt-4">
            <button id="btnEnviarDinero" class="btn btn-success btn-lg shadow">
                Enviar dinero a este contacto.
            </button>
        </div>
    </div>
<!--Modal para ingresar Nuevo contacto. Se abre el modal y el usuario ingresa los datos, luego cierra el modal-->
    <div class="modal fade" id="modalContacto" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Nuevo Contacto</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <form id="formNuevoContacto">
                        <div class="mb-3">
                            <label class="form-label">Nombre y Apellido</label>
                            <input type="text" id="nuevoName" class="form-control" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Número de CBU</label>
                            <input type="number" id="nuevaCBU" class="form-control" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Alias</label>
                            <input type="text" id="nuevoAlias" class="form-control" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Nombre del Banco</label>
                            <input type="text" id="nuevoBank" class="form-control" required>
                        </div>
                        <button type="submit" class="btn btn-primary w-100">Guardar Contacto</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="sendmoney.js"></script>
</body>

</html>
